<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero sheet</title>
<style>
  body { margin: 16px; font-family: system-ui, sans-serif; background: #f6efe0; color: #2b1d14; }
  h2 { margin: 24px 0 8px; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
  .cell { background: #fffaf0; border: 1px solid #e3d5b8; border-radius: 8px; padding: 4px; text-align: center; font-size: 11px; }
  .cell svg { width: 100%; height: auto; display: block; }
  .relief .cell { background: #000; color: #ccc; }
</style>
</head>
<body>
<p>Every species × class × gender, in colour, then the same figures as the medal sees them (grey = height). Not linked from the site.</p>
<div id="out"></div>
<script src="catalog.js"></script>
<script src="art.js"></script>
<script>
  const species = Object.keys(CATALOG.species);
  const classes = Object.keys(CATALOG.classes);
  const colors = Object.keys(CATALOG.color_hex);
  const hairColors = Object.keys(CATALOG.hair_colors);
  const hairs = Object.keys(CATALOG.hair_styles);
  const out = document.getElementById("out");
  let n = 0;
  function section(title, mode, filter) {
    const h = document.createElement("h2"); h.textContent = title; out.appendChild(h);
    const g = document.createElement("div"); g.className = "grid" + (mode === "relief" ? " relief" : ""); out.appendChild(g);
    for (const sp of species) for (const gender of ["m", "f"]) for (const cls of classes) {
      if (filter && !filter(sp, gender, cls)) continue;
      const hero = { gender, species: sp, cls, skin: n % 4, hair: hairs[(n >> 1) % 4], hairColor: hairColors[n % 4], color: colors[n % colors.length] };
      if (mode === "color") n++;
      const c = document.createElement("div"); c.className = "cell";
      c.innerHTML = ART.svg(hero, mode) + `<div>${CATALOG.species[sp].he[gender]} · ${CATALOG.classes[cls].he[gender]}</div>`;
      g.appendChild(c);
    }
  }
  section("בצבע", "color");
  n = 0;
  section("תבליט (מדליה)", "relief", (sp, g) => g === "m" && (sp === "human" || sp === "dragonborn"));
</script>
</body>
</html>
